
services:

  # -------------------------------
  # PostgreSQL for USER-SERVICE
  # -------------------------------
  postgres-user:
    image: postgres:16
    container_name: postgres-user
    environment:
      POSTGRES_DB: test_microservice_demo_user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------
  # PostgreSQL for ORDER-SERVICE
  # -------------------------------
  postgres-order:
    image: postgres:16
    container_name: postgres-order
    environment:
      POSTGRES_DB: test_microservice_demo_order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------
  # EUREKA SERVER
  # -------------------------------
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservice-network
    restart: unless-stopped

  # -------------------------------
  # USER SERVICE
  # -------------------------------
  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - microservice-network
    restart: unless-stopped

  # -------------------------------
  # ORDER SERVICE
  # -------------------------------
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres-order
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      # Kafka connection from inside Docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres-order:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - microservice-network
    restart: unless-stopped

  # -------------------------------
  # NOTIFICATION SERVICE
  # -------------------------------

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - eureka-server
      - kafka
    networks:
      - microservice-network
    restart: unless-stopped

  # -------------------------------
  # API GATEWAY
  # -------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - user-service
      - order-service
    networks:
      - microservice-network
    restart: unless-stopped


  # -------------------------------
  # KAFKA
  # -------------------------------
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      # Access Kafka from IntelliJ on Windows
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - microservice-network

    restart: unless-stopped




# -------------------------------
# Shared Docker network and storage
# -------------------------------
networks:
  microservice-network:
    driver: bridge

volumes:
  user-db-data:
  order-db-data:
  kafka-data:


