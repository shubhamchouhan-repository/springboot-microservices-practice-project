server:
  port: 8081

spring:
  application:
    name: USER-SERVICE
  datasource:
    # Own isolated database: user_service_db (created automatically if missing)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/test_microservice_demo_user_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}   # no default on purpose: set the DB_PASSWORD environment variable
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update      # dev convenience; use Flyway/Liquibase in production
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [USER-SERVICE:8081] %-5level %logger{30} - %msg%n"
  level:
    com.example.userservice: INFO
